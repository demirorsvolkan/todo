services:
  postgres:
    image: postgres:16
    container_name: todo-postgres
    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: todo-backend
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=todo_db;Username=todo_user;Password=todo_password"
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      
  frontend:
    build:
      context: ./frontend
    container_name: todo-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: