server {
    listen 80; 

    #web dosyalarının ana klasörünün yolunu gösterdik
    root /usr/share/nginx/html;

    #bir dizinde ilk bulunup gösterilmesi gerekn dosya
    index index.html;

    # / istekleri bu kod ile işleniyor
    location / {   
        # önce gelen uri isminde bir dosya olup olmadığı kontrol edilir varsa dönülür
        # yoksa bir dizin olup olmadığı kontrol edilir eğer dizinse
        # dizin içindeki index.html açılır 
        # eğer hiçbiri değilse standart olarak index.html sayfası dönülür
        try_files $uri $uri/ /index.html;
    }

    # /api/ istekleri bu kod ile işlenir
    location /api/ {
        #gelen istek backend servisine yönlendirilir
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;

        #gelen isteğin host adresini backende iletir örnek olarak
        # Host: tubitak.gov.tr şeklinde header gönderilir
        proxy_set_header Host $host;

        #backende varsayılan olarak istek nginx üstünden gittiğinden gerçekten istek atan ipyi göremez
        # bu satrıla gerçekten istek atan ip adresini gönderiyoruz
        proxy_set_header X-Real-IP $remote_addr;

        #gelen istek farklı proxilerden sürekli yönlendirilmiş oalbilir (aynen real ip gibi) biz de bu hangi ipleri sırayla
        # gezmiş onların listesini gönderiyoruz, küçük bir ayrıntı var, bu liste ancak her yönlenmede 
        #tutulduysa ve iletildiyse geçerli tutulmadıysa asla bilemeyiz 
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        #hangi protoklle geldiğini söyler örnek http ya da https olabilir
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
